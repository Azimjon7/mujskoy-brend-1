<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mujskoy Brend | Do'kon</title>
  <link rel="stylesheet" href="css/bootstrap.min.css" type="text/css">
  <link rel="stylesheet" href="css/font-awesome.min.css" type="text/css">
  <link rel="stylesheet" href="css/elegant-icons.css" type="text/css">
  <link rel="stylesheet" href="css/slicknav.min.css" type="text/css">
  <link rel="stylesheet" href="css/style.css" type="text/css">
</head>
<body class="shop-page">
  <div id="preloder"><div class="loader"></div></div>
  <div class="offcanvas-menu-overlay"></div>
  <div class="offcanvas-menu-wrapper">
    <div class="offcanvas__close">+</div>
    <div class="offcanvas__logo"><a href="index.html"><img src="img/mujskoy-logo.jpg" alt="logo"></a></div>
    <div id="mobile-menu-wrap"></div>
  </div>

  <header class="header header--dark">
    <div class="container-fluid">
      <div class="row align-items-center">
        <div class="col-xl-3 col-lg-3 col-8">
          <div class="header__logo header__logo--custom">
            <a href="index.html"><img src="img/mujskoy-logo.jpg" alt="logo"><span>Mujskoy Brend</span></a>
          </div>
        </div>
        <div class="col-xl-6 col-lg-6">
          <nav class="header__menu">
            <ul>
              <li><a href="index.html">Bosh sahifa</a></li>
              <li class="active"><a href="shop.html">Do'kon</a></li>
              <li><a href="shop-cart.html">Savat</a></li>
              <li><a href="checkout.html">Buyurtma</a></li>
              <li><a href="track-order.html">Buyurtmani kuzatish</a></li>
              <li><a href="contact.html">Bog'lanish</a></li>
              <li><a href="admin.html">Boshqaruv</a></li>
            </ul>
          </nav>
        </div>
        <div class="col-xl-3 col-lg-3 col-4 text-right">
          <ul class="header__right__widget header__right__widget--simple">
            <li><a href="shop-cart.html"><span class="icon_bag_alt"></span><div class="tip js-cart-count">0</div></a></li>
          </ul>
        </div>
      </div>
      <div class="canvas__open"><i class="fa fa-bars"></i></div>
    </div>
  </header>

  <section class="breadcrumb-custom">
    <div class="container">
      <h2>Do'kon</h2>
      <p>Erkaklar kiyimi, oyoq kiyim va aksessuarlar katalogi.</p>
    </div>
  </section>

  <section class="shop spad">
    <div class="container">
      <div class="shop-toolbar">
        <div class="shop-toolbar__filters">
          <button class="filter-btn active" data-category="">Barchasi</button>
          <button class="filter-btn" data-category="Futbolkalar">Futbolkalar</button>
          <button class="filter-btn" data-category="Aksesuarlar">Aksesuarlar</button>
          <button class="filter-btn" data-category="Ustki kiyimlar">Ustki kiyimlar</button>
          <button class="filter-btn" data-category="Shimlar">Shimlar</button>
          <button class="filter-btn" data-category="Oyoq kiyimlar">Oyoq kiyimlar</button>
          <button class="filter-btn" data-category="Bosh kiyimlar">Bosh kiyimlar</button>
        </div>
        <div class="shop-toolbar__controls">
          <div class="shop-toolbar__search">
            <input type="search" id="shop-search" placeholder="Mahsulot qidirish...">
          </div>
          <label class="shop-available-toggle" for="shop-available">
            <input type="checkbox" id="shop-available">
            <span>Faqat mavjudlari</span>
          </label>
          <div class="shop-toolbar__sort">
            <select id="shop-sort" aria-label="Saralash">
              <option value="newest">Yangi mahsulotlar</option>
              <option value="price_asc">Narxi: arzon - qimmat</option>
              <option value="price_desc">Narxi: qimmat - arzon</option>
              <option value="rating">Reyting bo'yicha</option>
            </select>
          </div>
        </div>
      </div>
      <div class="row" id="shop-grid"></div>
    </div>
  </section>

  <script src="js/jquery-3.3.1.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/jquery.slicknav.js"></script>
  <script src="js/main.js"></script>
  <script src="js/store.js"></script>
  <script src="js/shop-products.js"></script>
</body>
</html>
